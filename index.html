<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Synthetic AI Engine
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="topbar">

        <div>

            <h1>
                Synthetic AI Engine
            </h1>

            <p>
                Multi-Timeframe Market Analysis
            </p>

        </div>

        <div
            id="connection"
            class="connection"
        >
            Connecting...
        </div>

    </header>


    <main>

        <section class="panel">

            <div class="panel-title">

                <h2>
                    Live Synthetic Markets
                </h2>

                <button
                    onclick="loadMarkets()"
                >
                    Refresh
                </button>

            </div>

            <div
                id="markets"
                class="markets"
            >

                Loading markets...

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
